<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Notes — board</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --panel: #ffffff; --ink: #17181c; --dim: #6b7280; --line: #e3e5ea;
    --accent: #2f6df6; --warn: #b4451f; --good: #1f7a4d; --chip: #eef1f6;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --panel:#1c1f25; --ink:#e8eaef; --dim:#9aa3b2; --line:#2b303a;
            --accent:#6f9dff; --warn:#ff9a76; --good:#7ddcab; --chip:#252a33; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
  header { position: sticky; top:0; z-index:20; background:var(--panel);
           border-bottom:1px solid var(--line); padding:14px 22px 0; }
  .row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0; letter-spacing:.01em; }
  h1 small { color:var(--dim); font-weight:400; margin-left:8px; }
  .spacer { flex:1 }
  input[type=search] { background:var(--bg); border:1px solid var(--line); color:var(--ink);
      border-radius:8px; padding:8px 12px; min-width:260px; font-size:14px; }
  button { background:var(--chip); border:1px solid var(--line); color:var(--ink);
      border-radius:8px; padding:8px 12px; font-size:13px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  nav { display:flex; gap:4px; margin-top:12px; }
  nav a { padding:8px 14px; font-size:13px; color:var(--dim); text-decoration:none;
      border-bottom:2px solid transparent; cursor:pointer; }
  nav a[aria-selected=true] { color:var(--ink); border-bottom-color:var(--accent); font-weight:600; }
  main { padding:22px; max-width:1180px; margin:0 auto; }
  .stats { display:flex; gap:22px; flex-wrap:wrap; margin-bottom:20px; color:var(--dim); font-size:13px; }
  .stats b { color:var(--ink); font-size:20px; display:block; }
  .grid { display:grid; gap:14px; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; cursor:pointer; }
  .card:hover { border-color:var(--accent); }
  .card h3 { margin:0 0 6px; font-size:14px; line-height:1.35; }
  .card p { margin:0; color:var(--dim); font-size:13px;
      display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .meta { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .tag { font:11px/1.6 var(--mono); background:var(--chip); color:var(--dim);
      border-radius:5px; padding:2px 7px; }
  .tag.life { color:var(--accent) } .tag.rej { color:var(--warn) } .tag.arc { color:var(--good) }
  h2.sec { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim);
      margin:26px 0 12px; }
  .pillars { display:grid; gap:10px; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); }
  .pillar { background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent);
      border-radius:10px; padding:10px 12px; font-size:13px; }
  .pillar b { display:block; margin-bottom:4px; }
  .pillar span { color:var(--dim); font:12px/1.5 var(--mono); }
  aside { position:fixed; top:0; right:0; height:100%; width:min(680px, 94vw); background:var(--panel);
      border-left:1px solid var(--line); transform:translateX(102%); transition:transform .22s ease;
      overflow-y:auto; padding:22px 26px 60px; z-index:40; }
  aside.open { transform:none; }
  aside h2 { font-size:18px; margin:0 0 4px; }
  aside .path { font:12px/1.6 var(--mono); color:var(--dim); word-break:break-all; }
  aside h4 { margin:22px 0 6px; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); }
  aside p, aside li { font-size:14px; }
  aside ul { padding-left:18px; }
  aside code { font-family:var(--mono); font-size:12.5px; background:var(--chip); padding:1px 4px; border-radius:4px; }
  aside a { color:var(--accent); }
  .close { position:absolute; top:14px; right:18px; }
  .empty { color:var(--dim); padding:40px 4px; }
  .hint { color:var(--dim); font-size:12px; margin-top:8px }
  kbd { font:11px var(--mono); border:1px solid var(--line); border-radius:4px; padding:1px 5px; }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1><span id="board-title">Agent Notes</span><small id="scope"></small></h1>
    <span class="spacer"></span>
    <input type="search" id="q" placeholder="Search title, mechanism, alternatives…  ( / )" />
    <button id="connect">Connect notes folder</button>
  </div>
  <nav id="tabs">
    <a data-view="overview" aria-selected="true">Overview</a>
    <a data-view="guardrails">Guardrails</a>
    <a data-view="timeline">Timeline</a>
    <a data-view="all">All notes</a>
  </nav>
</header>
<main>
  <div class="stats" id="stats"></div>
  <section id="view"></section>
  <p class="hint" id="hint"></p>
</main>
<aside id="drawer"><button class="close" id="close">close ✕</button><div id="drawer-body"></div></aside>
<script>
const NOTES = /*__AGENT_NOTES_DATA__*/[];
const BUNDLED = "__BUNDLED__";
const LIFECYCLES = ["proposed","implemented","rejected"];
const ARCHIVE = "archived";
let notes = NOTES.slice();

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
}
function body(md){
  const out = []; let list = false;
  for (const raw of md.split("\n")) {
    const line = raw.trimEnd();
    if (/^\s*[-*]\s+/.test(line)) { if(!list){out.push("<ul>");list=true}
      out.push("<li>"+inline(line.replace(/^\s*[-*]\s+/,""))+"</li>"); continue; }
    if (list) { out.push("</ul>"); list = false; }
    if (line.trim() === "") continue;
    out.push("<p>"+inline(line)+"</p>");
  }
  if (list) out.push("</ul>");
  return out.join("");
}
function section(n, name){
  const s = (n.sections||[]).find(x => x.heading.toLowerCase().startsWith(name));
  return s ? s.body : "";
}
function altCount(n){
  const body = section(n, "alternatives") || section(n, "备选");
  return (body.match(/^\s*[-*]\s+/gm) || []).length;
}
function lifeTag(l){
  const cls = l === "rejected" ? "rej" : l === ARCHIVE ? "arc" : "life";
  return '<span class="tag '+cls+'">'+esc(l)+'</span>';
}
function card(n){
  const gist = section(n, "decision") || section(n, "decision") || section(n, "proposal") || section(n,"problem");
  return '<article class="card" data-path="'+esc(n.path)+'"><h3>'+esc(n.title)+'</h3>'
    + '<p>'+esc(gist.slice(0,240))+'</p><div class="meta">'
    + lifeTag(n.lifecycle) + '<span class="tag">'+esc(n.cls)+'</span>'
    + (n.date ? '<span class="tag">'+esc(n.date)+'</span>' : "")
    + (altCount(n) ? '<span class="tag">'+altCount(n)+' alt</span>' : "")
    + '</div></article>';
}
function inbound(){
  const map = {};
  for (const n of notes) for (const s of (n.sections||[])) {
    const re = /\((?:\.\.\/)*(?:implemented|proposed|rejected|archived)\/([^)\s#]+\.md)/g;
    let m; while ((m = re.exec(s.body)) !== null) {
      const key = m[1].split("/").pop();
      map[key] = (map[key]||0)+1;
    }
  }
  return map;
}
function stat(label, value){ return '<div><b>'+value+'</b>'+label+'</div>'; }

let view = "overview";
function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const hits = q ? notes.filter(n => (n.title+" "+n.path+" "+(n.sections||[]).map(s=>s.body).join(" ")).toLowerCase().includes(q)) : notes;
  const counts = {}; for (const l of LIFECYCLES) counts[l] = notes.filter(n=>n.lifecycle===l).length;
  counts[ARCHIVE] = notes.filter(n=>n.lifecycle===ARCHIVE).length;
  document.getElementById("stats").innerHTML =
    stat("total", notes.length) + LIFECYCLES.map(l => stat(l, counts[l]||0)).join("") + stat(ARCHIVE, counts[ARCHIVE]||0);
  const box = document.getElementById("view");
  if (notes.length === 0) {
    box.innerHTML = '<p class="empty">No notes loaded. Click “Connect notes folder” and pick the notes root, '
      + 'or build a bundled board with <code>--bundle</code>.</p>';
    return;
  }
  if (q) { box.innerHTML = '<h2 class="sec">'+hits.length+' match(es)</h2><div class="grid">'+hits.map(card).join("")+'</div>'; return; }
  if (view === "overview") {
    const inb = inbound();
    const pillars = notes.filter(n => n.lifecycle === "implemented")
      .map(n => ({ n, deg: inb[n.file] || 0 })).sort((a,b) => b.deg - a.deg).slice(0, 8);
    const classes = {}; for (const n of notes) if (n.lifecycle !== ARCHIVE) classes[n.cls] = (classes[n.cls]||0)+1;
    box.innerHTML =
      '<h2 class="sec">Load-bearing decisions (by inbound references)</h2><div class="pillars">'
      + pillars.map(p => '<div class="pillar"><b>'+esc(p.n.title)+'</b><span>'+esc(p.n.cls)+' · '+p.deg+' ref(s)</span></div>').join("")
      + '</div><h2 class="sec">Active surface by class</h2><div class="pillars">'
      + Object.entries(classes).sort((a,b)=>b[1]-a[1]).map(([k,v]) => '<div class="pillar"><b>'+esc(k)+'</b><span>'+v+' active note(s)</span></div>').join("")
      + '</div><h2 class="sec">Recently shipped</h2><div class="grid">'
      + notes.filter(n=>n.lifecycle==="implemented").sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,6).map(card).join("")
      + '</div>';
    return;
  }
  if (view === "guardrails") {
    const rejected = notes.filter(n => n.lifecycle === "rejected");
    box.innerHTML = '<h2 class="sec">Declined proposals ('+rejected.length+')</h2><div class="grid">'
      + rejected.map(card).join("") + '</div>'
      + '<h2 class="sec">Every alternative on record</h2>'
      + notes.filter(n=>altCount(n)>0).map(n =>
          '<div class="pillar"><b>'+esc(n.title)+'</b><span>'+esc(n.lifecycle+'/'+n.cls)+'</span>'
          + body(section(n,"alternatives") || section(n,"备选")) + '</div>').join("");
    return;
  }
  if (view === "timeline") {
    const byMonth = {};
    for (const n of notes) {
      if (!n.date) continue;
      const m = n.date.slice(0,7);
      (byMonth[m] = byMonth[m] || []).push(n);
    }
    box.innerHTML = Object.keys(byMonth).sort().reverse().map(m =>
      '<h2 class="sec">'+m+' · '+byMonth[m].length+'</h2><div class="grid">'+byMonth[m].map(card).join("")+'</div>').join("");
    return;
  }
  box.innerHTML = '<div class="grid">'+notes.map(card).join("")+'</div>';
}
function open(path){
  const n = notes.find(x => x.path === path); if (!n) return;
  document.getElementById("drawer-body").innerHTML =
    '<h2>'+esc(n.title)+'</h2><div class="path">'+esc(n.path)+'</div><div class="meta" style="margin-top:10px">'
    + lifeTag(n.lifecycle)+'<span class="tag">'+esc(n.cls)+'</span><span class="tag">'+esc(n.status)+'</span></div>'
    + (n.sections||[]).map(s => (s.heading.toLowerCase().startsWith("alternatives") ? "" : "")
        + '<h4>'+esc(s.heading)+'</h4>'+body(s.body)).join("");
  document.getElementById("drawer").classList.add("open");
}
document.addEventListener("click", e => {
  const c = e.target.closest(".card"); if (c) open(c.dataset.path);
});
document.getElementById("close").onclick = () => document.getElementById("drawer").classList.remove("open");
document.getElementById("q").oninput = render;
document.getElementById("tabs").onclick = e => {
  const a = e.target.closest("a[data-view]"); if (!a) return;
  view = a.dataset.view;
  for (const el of document.querySelectorAll("#tabs a")) el.setAttribute("aria-selected", String(el === a));
  render();
};
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); document.getElementById("q").focus(); }
  if (e.key === "Escape") document.getElementById("drawer").classList.remove("open");
});

async function connect(){
  if (!window.showDirectoryPicker) {
    document.getElementById("hint").textContent = "This browser cannot open local folders; build a bundled board instead.";
    return;
  }
  const dir = await window.showDirectoryPicker({ mode: "read" });
  const collected = [];
  async function walk(handle, prefix){
    for await (const [name, entry] of handle.entries()) {
      if (entry.kind === "directory") { await walk(entry, prefix + name + "/"); continue; }
      if (!name.endsWith(".md") || name.endsWith(".zh.md") || name === "AGENTS.md") continue;
      const segs = (prefix + name).split("/");
      if (segs.length !== 3) continue;
      const text = await (await entry.getFile()).text();
      const lines = text.split("\n");
      const title = (lines[0]||"").replace(/^# Agent Note:\s*/,"") || name;
      const status = (lines.slice(0,6).find(l => l.startsWith("Status:"))||"Status: unknown").slice(7).trim();
      const retired = (lines.slice(0,8).find(l => l.startsWith("Archived:"))||"").slice(9).trim() || null;
      const sections = []; let cur = null;
      for (const line of lines) {
        if (line.startsWith("## ")) { cur = { heading: line.slice(3).trim(), body: "" }; sections.push(cur); }
        else if (cur && !line.startsWith("Status:") && !line.startsWith("# Agent Note:")) cur.body += line + "\n";
      }
      collected.push({ path: prefix+name, lifecycle: segs[0], cls: segs[1], file: name,
        date: (name.match(/^\d{4}-\d{2}-\d{2}/)||[""])[0], title, status, retired,
        sections: sections.map(s => ({ heading: s.heading, body: s.body.trim() })) });
    }
  }
  await walk(dir, "");
  collected.sort((a,b) => a.path.localeCompare(b.path));
  notes = collected;
  document.getElementById("scope").textContent = "· " + collected.length + " note(s), live from " + dir.name;
  document.getElementById("hint").textContent = "Re-read automatically when you re-connect. Edit notes and click Connect again to refresh.";
  render();
}
document.getElementById("connect").onclick = connect;

document.getElementById("board-title").textContent = (typeof document.title === "string" ? "" : "") ;
if (BUNDLED) {
  document.getElementById("connect").style.display = "none";
  document.getElementById("hint").textContent = "Bundled snapshot: the notes are embedded in this file.";
} else if (!window.showDirectoryPicker) {
  document.getElementById("connect").style.display = "none";
}
render();
</script>
</body>
</html>
