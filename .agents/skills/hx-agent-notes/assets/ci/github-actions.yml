name: Agent Notes Diff
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  redline:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .agent-notes-policy
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        continue-on-error: true
      - id: endpoints
        continue-on-error: true
        run: uv run .agent-notes-policy/.agents/skills/hx-agent-notes/scripts/github/base.py
      - name: Collect exact diff with protected default-branch gate
        if: always()
        continue-on-error: true
        env:
          NOTES_BASE: ${{ steps.endpoints.outputs.base }}
          NOTES_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 .agent-notes-policy/.agents/skills/hx-agent-notes/scripts/github/collect.py --skill .agent-notes-policy/.agents/skills/hx-agent-notes --repo . --diff --base "$NOTES_BASE" --head "$NOTES_HEAD"
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: agent-notes-report
          path: agent-notes-report.json
          if-no-files-found: warn
          retention-days: 7
