name: Agent Notes Full
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  workspace:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        continue-on-error: true
      - name: Collect default branch diagnostics
        if: always()
        continue-on-error: true
        env:
          NOTES_HEAD: ${{ github.sha }}
        run: python3 .agents/skills/hx-agent-notes/scripts/github/collect.py --skill .agents/skills/hx-agent-notes --all --base "$NOTES_HEAD" --head "$NOTES_HEAD"
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: agent-notes-report
          path: agent-notes-report.json
          if-no-files-found: warn
          retention-days: 7
