name: Build Docker image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  # secrets 不允许出现在 step 的 if: 里，这里先提升为 env，step 再用 env 判断
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  # 代码质量红线（体量/目录/函数/注释/格式/类型棘轮 + lane 覆盖 + 接线指纹）。
  #
  # 为什么单独成一关而不是塞进 test：这六类判据是**结构性**的（文件行数、目录
  # 文件数、函数长度），跑得比 jest/vitest 快得多，失败了人一眼就知道该拆哪个文件；
  # 与 test 混在一起会让真正的原因被几百行测试输出淹没。
  #
  # 元门禁（指纹 + 负向探针）也在这里跑：负向探针要起几十个子进程，不进 pre-commit，
  # 由 CI 与手动命令承担 —— 它证明的是门禁真的会红，没有它，红线集会静默退化。
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 代码质量红线
        run: npm run check:gates
      - name: 元门禁（接线指纹：门禁被摘掉/阈值被放松必须被发现）
        run: npm run check:gates:fingerprint
      - name: 负向探针（每条判据的违规组必须 FAIL、控制组必须 PASS）
        run: npm run check:gates:probe

  # 多语言红线：控制台文案一旦有人图快直接写中文字面量，多语言会**静默退化**
  # —— 中文用户看不出问题，英文用户看到一块中文，且 review 极难发现。
  # 这里用机器钉死三条线：
  #   1) dashboard/app.ts 不得出现硬编码 CJK 字面量（注释/调试输出除外）
  #   2) 各语种词条 key 必须与基准语种一致（不许缺、不许多个）
  #   3) 代码里 t('key') 用到的 key 必须在字典里存在
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check i18n red lines
        run: node scripts/check-i18n.ts

  # 上游契门禁：上游改了端点/头名，必须**机器发现**，不能靠人读文档再对代码。
  # 判据：抓包生成的契约快照（docs/reverse/upstream-contract.json）
  #       ↔ 单一真源（src/upstream/upstream-contract.ts）对账；
  #       另拦两类违规：源码里绕过真源的裸头字面量、已废弃头的回潮。
  # 上游变更后的处置：重抓包 → npm run gen:contract → 改真源文件 → 本关转绿。
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify upstream contract matches the single source of truth
        run: node scripts/check-upstream-contract.ts

  # 镜像启动门禁：真实构建 + 真实起容器 + 真实打健康检查。
  #
  # 为什么单独有这一关：上面的 test 用 mock 上游、**不启动容器**，所以"新镜像 +
  # 真实/旧 /data"这条路从没被验过——真实事故就是换镜像后容器起不来（删掉几个
  # /data/*.json 才恢复）。这一关把那条路补上：空目录 / 现有 data 副本 / 逐个把
  # 某个 JSON 写坏（users.json 必须拒绝启动），任何一个场景不过就不允许推镜像。
  image-boot:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build image and verify it actually boots
        run: node scripts/ci/pipeline-image-test.ts

  # 发版门禁：tag（v*）必须与 package.json 版本一致，否则直接失败。
  # 这是「发版必须更新版本号」的强制保障——漏 bump 版本就推 tag 会在这一步被拦下。
  check-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=${TAG_VERSION} package.json=${PKG_VERSION}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch: tag v${TAG_VERSION} != package.json ${PKG_VERSION}. Run 'npm version ${TAG_VERSION}' (or bump package.json) before tagging."
            exit 1
          fi
          echo "version-ok=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
        id: verify

  build-push:
    needs: [test, image-boot, i18n, contract, quality]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (GHCR)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # 版本注入：把版本号硬编码进镜像内 dashboard/version.json（镜像里显示什么由这里决定）。
      #
      # **不要用 steps.meta.outputs.version 判断**：tags 里的 `type=ref,event=branch`
      # 会让 metadata-action 把 version 解析成**分支名**（main/master）。它非空，所以
      # 「为空才回退 package.json」的写法永远不会触发 → latest 镜像显示 version="main"
      # （v1.11.7 线上实测就是这个）。改成按 ref 类型分支判断：
      #   语义化 tag（refs/tags/vX.Y.Z）→ 用 tag 版本（去掉前缀 v）；
      #   分支/PR push → 用 package.json 版本（npm version 已 bump，是唯一版本真源）。
      - name: Inject version into frontend (hardcoded by pipeline)
        run: |
          REF_TYPE="${{ github.ref_type }}"
          if [ "$REF_TYPE" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          VERSION="${VERSION#v}"
          SHA="${{ github.sha }}"
          node scripts/release/inject-version.ts --version "${VERSION}" --repo "https://github.com/${{ github.repository }}"
          # 额外把 commit sha 也带上，便于追版本来源
          node -e "const fs=require('fs');const p='dashboard/version.json';const j=JSON.parse(fs.readFileSync(p));j.commit='${SHA}';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          cat dashboard/version.json
          # 守卫：版本号必须是 x.y.z 数字形式。绝不允许分支名（main/master）之类
          # 混进镜像——线上曾因此显示 version="main"（v1.11.7 实测），前端无法判版本。
          node -e "
            const fs=require('fs')
            const v=JSON.parse(fs.readFileSync('dashboard/version.json','utf8')).version
            if(!/^[0-9]+\\.[0-9]+\\.[0-9]+/.test(v)){
              console.error('版本号非法: '+JSON.stringify(v)+' —— 不能是分支名/dev，必须是 x.y.z')
              process.exit(1)
            }
            console.log('版本号校验通过: '+v)
          "

      - name: Build and push (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 可选：配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets 后同时推到 Docker Hub
      - name: Login to Docker Hub (optional)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push (Docker Hub, optional)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/freebuff-proxy:latest
            ${{ env.DOCKERHUB_USERNAME }}/freebuff-proxy:${{ steps.meta.outputs.version || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
