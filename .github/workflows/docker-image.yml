name: Build Docker image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  # secrets 不允许出现在 step 的 if: 里，这里先提升为 env，step 再用 env 判断
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  # 发版门禁：tag（v*）必须与 package.json 版本一致，否则直接失败。
  # 这是「发版必须更新版本号」的强制保障——漏 bump 版本就推 tag 会在这一步被拦下。
  check-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=${TAG_VERSION} package.json=${PKG_VERSION}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch: tag v${TAG_VERSION} != package.json ${PKG_VERSION}. Run 'npm version ${TAG_VERSION}' (or bump package.json) before tagging."
            exit 1
          fi
          echo "version-ok=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
        id: verify

  build-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (GHCR)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # 版本注入：把流水线解析出的版本号硬编码进镜像内 dashboard/version.json。
      # 镜像里显示的版本由这里决定（tag→1.10.0；分支/PR→dev+sha），
      # 与本地无关；package.json 版本只是本地开发/门禁参考。
      # 注意：docker/metadata-action 的 `version` 输出只在**语义化 tag** 构建时才有值，
      # 主分支 push 时（同时会推 latest 镜像）`outputs.version` 为空，若直接回退 'dev'
      # 会导致 latest 镜像永远显示 dev。因此 tag 用 metadata 版本，分支/默认分支构建
      # 回退到 package.json 版本（发版时已由 npm version 同步 bump，是唯一版本真源），
      # 保证 `latest` 也带上真实版本号而不是 dev。
      - name: Inject version into frontend (hardcoded by pipeline)
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          VERSION="${steps.meta.outputs.version:-${PKG_VERSION}}"
          SHA="${{ github.sha }}"
          node scripts/inject-version.mjs --version "${VERSION}" --repo "https://github.com/${{ github.repository }}"
          # 额外把 commit sha 也带上，便于追版本来源
          node -e "const fs=require('fs');const p='dashboard/version.json';const j=JSON.parse(fs.readFileSync(p));j.commit='${SHA}';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          cat dashboard/version.json

      - name: Build and push (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 可选：配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets 后同时推到 Docker Hub
      - name: Login to Docker Hub (optional)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push (Docker Hub, optional)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/freebuff-proxy:latest
            ${{ env.DOCKERHUB_USERNAME }}/freebuff-proxy:${{ steps.meta.outputs.version || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
