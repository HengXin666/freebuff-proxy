# freebuff-proxy — 配置文件示例(Docker 部署时复制为 /data/config.yaml)
#
# 这里**只有**监听地址与端口. 其余全部配置项都在控制台[系统设置]页可调
# (保存后重启生效), 落盘在 <data_dir>/settings.json ---- 因此**不需要**在这里
# 维护一份"可调项清单": 清单的真源是 src/config/tunables.ts, 页面按它渲染.
#
# 为什么只留这两项(用户裁决 2026-10-05):
#   host/port 决定了"控制台在哪里", 是启动前就必须知道的东西 ---- 先有它
#   才能打开页面去调别的. 其余项若也留在这里, 就会出现"同一个值两个入口"
#   (改文件 vs 改页面), 而谁能赢取决于加载顺序.
server:
  # Docker 部署请用 0.0.0.0(compose 已通过 FREEBUFF_PROXY_HOST 注入)
  host: 127.0.0.1
  port: 8787
