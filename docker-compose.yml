# freebuff-proxy — 一键部署
#   cp .env.example .env   # 按需修改 ADMIN_PASSWORD 等
#   docker compose up -d --build
# 数据全部落在 ./data（容器内 /data），删除容器不丢数据。
#
# 网络模式说明：
#   - 默认 NETWORK_MODE=host：容器与宿主机共享网络栈。
#     代理跑在这台机器（本机/VPS 宿主机）时，配置里直接写 http://127.0.0.1:<端口> 即可，
#     无需 docker 网关 IP、无需 host.docker.internal（Clash 只监听 127.0.0.1 也能通）。
#     服务直接监听宿主 0.0.0.0:8787，访问 http://<机器IP>:8787。
#   - 若想用默认桥接网络（多容器隔离等）：NETWORK_MODE=bridge，
#     此时用 docker 网关 IP（172.17.0.1）或 host.docker.internal 访问宿主机代理。
services:
  freebuff-proxy:
    build: .
    image: freebuff-proxy:latest
    container_name: freebuff-proxy
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    network_mode: ${NETWORK_MODE:-host}
    # 仅 bridge 模式生效；host 模式忽略（服务已直接监听 0.0.0.0:8787）
    ports:
      - "${PORT:-8787}:8787"
    environment:
      FREEBUFF_PROXY_DATA_DIR: /data
      FREEBUFF_PROXY_CONFIG: /data/config.yaml
      FREEBUFF_PROXY_HOST: 0.0.0.0
      FREEBUFF_PROXY_PORT: "8787"
      # 首次启动管理员（不设 ADMIN_PASSWORD 则随机生成，打印在 docker compose logs 里）
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 上游代理（可选）：优先用 /data/config.yaml 的 upstream.proxies；
      # 代理在本机时写 http://127.0.0.1:<端口>（host 网络默认可达）
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      # 172.16.0.0/12 = docker 网关/内网网段，默认不走代理
      NO_PROXY: ${NO_PROXY:-127.0.0.1,localhost,172.16.0.0/12}
      TZ: ${TZ:-Asia/Shanghai}
    extra_hosts:
      # 仅 bridge 模式需要（host 模式忽略）：容器内可用 http://host.docker.internal:<端口> 访问宿主机代理
      - "host.docker.internal:host-gateway"
    volumes:
      # 宿主机 ./data → 容器 /data（凭据/配置/用户/会话/登录流程都在这）
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
