# freebuff-proxy — 一键部署
#   cp .env.example .env   # 按需修改 ADMIN_PASSWORD / 代理等
#   docker compose up -d --build
# 数据全部落在 ./data（容器内 /data），删除容器不丢数据。
services:
  freebuff-proxy:
    build: .
    image: freebuff-proxy:latest
    container_name: freebuff-proxy
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "${PORT:-8787}:8787"
    environment:
      FREEBUFF_PROXY_DATA_DIR: /data
      FREEBUFF_PROXY_CONFIG: /data/config.yaml
      FREEBUFF_PROXY_HOST: 0.0.0.0
      FREEBUFF_PROXY_PORT: "8787"
      # 首次启动管理员（不设 ADMIN_PASSWORD 则随机生成，打印在 docker compose logs 里）
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 上游代理（可选）：支持 HTTP(S)_PROXY / NO_PROXY，或编辑 /data/config.yaml 的 upstream.proxy
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-127.0.0.1,localhost}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 宿主机 ./data → 容器 /data（凭据/配置/用户/会话/登录流程都在这）
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
