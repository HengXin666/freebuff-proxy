# freebuff-proxy — 一键部署
#   cp .env.example .env   # 可选；不建 .env 则全部用默认值
#   docker compose up -d --build
# 数据全部落在 ./data（容器内 /data），删除容器不丢数据。
#
# 网络模式：
#   - 默认 bridge：端口映射 ports 生效，PORT 变量控制对外端口。
#     代理在另一台机器/本机且监听 0.0.0.0 时：config 里填它的真实 IP（和你其他容器一样）。
#   - 需要容器直接访问"只监听 127.0.0.1 的宿主机代理"时，可设 NETWORK_MODE=host：
#     docker compose 环境变量 NETWORK_MODE=host（此时服务直接监听 0.0.0.0:<PORT>，ports 映射被忽略）。
services:
  freebuff-proxy:
    build: .
    image: freebuff-proxy:latest
    container_name: freebuff-proxy
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    network_mode: ${NETWORK_MODE:-bridge}
    ports:
      # 仅 bridge 模式生效；host 模式下服务直接监听宿主 0.0.0.0:<PORT>
      - "${PORT:-8787}:8787"
    environment:
      FREEBUFF_PROXY_DATA_DIR: /data
      FREEBUFF_PROXY_CONFIG: /data/config.yaml
      FREEBUFF_PROXY_HOST: 0.0.0.0
      # PORT 两种模式都生效（bridge 走端口映射，host 走直接监听）
      FREEBUFF_PROXY_PORT: "${PORT:-8787}"
      # 首次启动管理员（不设 ADMIN_PASSWORD 则随机生成，打印在 docker compose logs 里）
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 上游代理（可选）：优先用 /data/config.yaml 的 upstream.proxies
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      # 172.16.0.0/12 = docker 网关/内网网段，默认不走代理
      NO_PROXY: ${NO_PROXY:-127.0.0.1,localhost,172.16.0.0/12}
      TZ: ${TZ:-Asia/Shanghai}
    extra_hosts:
      # 仅 bridge 模式需要：容器内可用 http://host.docker.internal:<端口> 访问宿主机代理（需代理监听 0.0.0.0）
      - "host.docker.internal:host-gateway"
    volumes:
      # 宿主机 ./data → 容器 /data（凭据/配置/用户/会话/登录流程都在这）
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
